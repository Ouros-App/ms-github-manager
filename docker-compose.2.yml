version: "3.8"

services:
  api:
    build:
      context: "."
    image: "ms-github-manager_2:latest"
    container_name: "ms-github-manager_2"
    env_file:
      - ".env"
    ports:
      - "6539:8000"
    volumes:
      - "./app:/app/app"
      - "./requirements.txt:/app/requirements.txt:ro"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
