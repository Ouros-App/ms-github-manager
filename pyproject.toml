[project]
name = "ms-github-manager"
version = "0.1.0"
description = "API para criar e gerenciar repositorios da organizacao Ouros App no GitHub"
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "PyGithub==2.5.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["worker"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = [
    "node_modules*",
    "tests*",
]
