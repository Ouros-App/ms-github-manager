[project]
name = "ms-github-manager"
version = "0.1.0"
description = "API para criar e gerenciar repositorios da organizacao Ouros App no GitHub"
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
