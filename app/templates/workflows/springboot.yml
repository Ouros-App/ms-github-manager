name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: conventional-commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps)(\([A-Za-z0-9_.-]+\))?(!)?: .+'

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps)(\([A-Za-z0-9_.-]+\))?(!)?: .+'
          git log --format=%s "$BASE_SHA..$HEAD_SHA" | while IFS= read -r subject; do
            if ! echo "$subject" | grep -Eq "$pattern"; then
              echo "Invalid conventional commit message: $subject"
              exit 1
            fi
          done

  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/app_test
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/app_test
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test with Maven
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$GITHUB_RUN_NUMBER" = "1" ]; then
            if [ -f mvnw ]; then chmod +x mvnw && ./mvnw -B package -DskipTests; elif [ -f pom.xml ]; then mvn -B package -DskipTests; fi
          elif [ -f mvnw ]; then
            chmod +x mvnw && ./mvnw -B verify
          elif [ -f pom.xml ]; then
            mvn -B verify
          fi

      - name: Set up Gradle
        if: ${{ hashFiles('build.gradle', 'build.gradle.kts') != '' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test with Gradle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$GITHUB_RUN_NUMBER" = "1" ]; then
            if [ -f gradlew ]; then chmod +x gradlew && ./gradlew clean build -x test; elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then gradle clean build -x test; fi
          elif [ -f gradlew ]; then
            chmod +x gradlew && ./gradlew clean build
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle clean build
          fi

  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SonarCloud
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "sonar.organization=${SONAR_ORGANIZATION:-$owner}"
            echo "sonar.projectKey=${SONAR_PROJECT_KEY:-${owner}_${repo}}"
            echo "sonar.sources=."
            echo "sonar.exclusions=.git/**,.github/**,target/**,build/**,.gradle/**"
          } > sonar-project.properties

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs:
      - ci
      - sonarcloud
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: echo "Configure o deploy deste repositorio."
