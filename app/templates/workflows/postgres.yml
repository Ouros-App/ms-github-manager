name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: conventional-commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps)(\([A-Za-z0-9_.-]+\))?(!)?: .+'

  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scaffold
        run: |
          test -f README.md
          test -f config.yaml
          test -f requirements.txt
          test -f scripts/apply_sql.py
          test -f sql/versionamento.sql

  sql:
    name: sql
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration naming
        run: |
          find sql -type f -name '*.sql' | sort | grep -q .
          grep -Eq 'file:[[:space:]]+[A-Za-z0-9_.-]+\.sql' config.yaml

      - name: Block destructive SQL
        run: |
          if grep -RInE '\bDROP[[:space:]]+DATABASE\b' sql; then
            echo "DROP DATABASE is forbidden"
            exit 1
          fi
