name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

jobs:
  conventional-commits:
    name: conventional-commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps)(\([A-Za-z0-9_.-]+\))?(!)?: .+'

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps)(\([A-Za-z0-9_.-]+\))?(!)?: .+'
          git log --format=%s "$BASE_SHA..$HEAD_SHA" | while IFS= read -r subject; do
            if ! echo "$subject" | grep -Eq "$pattern"; then
              echo "Invalid conventional commit message: $subject"
              exit 1
            fi
          done

  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi

      - name: Lint
        run: |
          if [ -f package.json ]; then npm run lint --if-present; fi

      - name: Type check
        run: |
          if [ -f package.json ]; then npm run typecheck --if-present; fi

      - name: Test
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$GITHUB_RUN_NUMBER" = "1" ]; then
            echo "Skipping tests on first workflow run."
          elif [ -f package.json ]; then
            npm test --if-present
          fi

      - name: Build
        run: |
          if [ -f package.json ]; then npm run build --if-present; else test -f README.md; fi

  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SonarCloud
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "sonar.organization=${SONAR_ORGANIZATION:-$owner}"
            echo "sonar.projectKey=${SONAR_PROJECT_KEY:-${owner}_${repo}}"
            echo "sonar.sources=."
            echo "sonar.exclusions=.git/**,.github/**,node_modules/**,dist/**,build/**,coverage/**"
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              echo "sonar.branch.name=main"
            fi
          } > sonar-project.properties

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Publish SonarCloud project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          project_key="$(grep '^sonar.projectKey=' sonar-project.properties | cut -d= -f2-)"
          curl -sS -u "${SONAR_TOKEN}:" -X POST "https://sonarcloud.io/api/projects/update_visibility" \
            -d "project=${project_key}" \
            -d "visibility=public"

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
